<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#17202A"></rect>

  <!-- Robot base -->
  <rect x="12" y="45" width="20" height="6" rx="2" fill="#8A949D"></rect>

  <!-- First robot arm -->
  <rect x="20" y="27" width="6" height="20" rx="3" fill="#DCE2E7" transform="rotate(-15 23 37)"></rect>

  <!-- Shoulder -->
  <circle cx="20" cy="43" r="6" fill="#4C78A8"></circle>

  <!-- Elbow -->
  <circle cx="27" cy="25" r="5" fill="#4C78A8"></circle>

  <!-- Second robot arm -->
  <rect x="27" y="22" width="22" height="6" rx="3" fill="#DCE2E7" transform="rotate(20 27 25)"></rect>

  <!-- End effector -->
  <circle cx="48" cy="32" r="5" fill="#3A9D5D"></circle>

  <!-- XR status indicator -->
  <circle cx="49" cy="13" r="4" fill="#3A9D5D"></circle>

</svg>